spring.application.name=medicine-finder
server.port=8080
spring.datasource.url=jdbc:h2:mem:medfind;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=${JWT_SECRET:medfind-development-secret-key-change-before-production-2026}
app.jwt.expiration-ms=86400000
