spring.application.name=medicine-finder

server.port=${PORT:8080}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:medfind;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}



spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false



spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console


app.jwt.secret=${JWT_SECRET:medfind-development-secret-key-change-before-production-2026}
app.jwt.expiration-ms=86400000


app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}